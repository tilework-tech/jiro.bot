AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Static hosting for jiro.bot: private S3, CloudFront, ACM, Route 53, and a
  least-privilege GitHub Actions deploy role. Modeled on nori-docs.

Parameters:
  DomainName:
    Type: String
    Default: jiro.bot

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z05729413D5MHTW3NNZHL

  SiteBucketName:
    Type: String
    Default: jiro-bot-site

  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::870844658207:oidc-provider/token.actions.githubusercontent.com

  # New repos get GitHub's immutable OIDC subject: owner@id/repo@id.
  GitHubOrg:
    Type: String
    Default: tilework-tech@240563687

  GitHubRepo:
    Type: String
    Default: jiro.bot-placeholder@1412115237

  DeployRoleName:
    Type: String
    Default: github-actions-jiro-bot-deploy

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SiteBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: CloudFront access to the private jiro.bot bucket.
        Name: jiro-bot-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        Comment: jiro.bot landing page.
        CustomErrorResponses:
          - ErrorCachingMinTTL: 60
            ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
          - ErrorCachingMinTTL: 60
            ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: jiro-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: jiro-s3-origin
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  ApexAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, EvaluateTargetHealth: false, HostedZoneId: Z2FDTNDATAQYW2 }
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A

  ApexAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, EvaluateTargetHealth: false, HostedZoneId: Z2FDTNDATAQYW2 }
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA

  WwwAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, EvaluateTargetHealth: false, HostedZoneId: Z2FDTNDATAQYW2 }
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A

  WwwAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, EvaluateTargetHealth: false, HostedZoneId: Z2FDTNDATAQYW2 }
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeployRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub
                  - repo:${Org}/${Repo}:ref:refs/heads/main
                  - Org: !Ref GitHubOrg
                    Repo: !Ref GitHubRepo
      Policies:
        - PolicyName: publish-jiro-bot-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSiteBucket
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Sid: PublishSiteObjects
                Effect: Allow
                Action: [s3:DeleteObject, s3:GetObject, s3:PutObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Sid: InvalidateSiteDistribution
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref SiteDistribution
  DistributionDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
