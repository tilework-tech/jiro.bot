<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Factory comparison proof</title><style>body{font:16px system-ui;margin:24px;background:#f2f4f8;color:#161616}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}img{display:block;max-width:100%;height:auto;border:1px solid #c1c7cd}select,input{font:inherit}h1{font-size:24px}</style><h1>Factory comparison table</h1><p>Exact approved copy; five product columns. Mobile captures show pinned labels at the start, Factory, and the final column.</p><nav><label>Capture <select id="capture"><option>1440-start</option><option>390-start</option><option>390-factory</option><option>390-end</option><option>320-start</option><option>320-factory</option><option>320-end</option></select></label><label>Zoom <input id="zoom" type="range" min="30" max="100" value="100"></label></nav><img id="proof" src="table-1440-start.png" alt="Screenshot of comparison table at selected viewport and scroll position"><script>capture.onchange=()=>proof.src='table-'+capture.value+'.png';zoom.oninput=()=>proof.style.maxWidth=zoom.value+'%';</script></html>
