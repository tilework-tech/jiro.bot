<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sushi Rush · jiro.bot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Silkscreen&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #120d0a; color: #f4ead7; font-family: 'Instrument Sans', system-ui, sans-serif; }
      main { max-width: 1320px; margin: 0 auto; padding: 24px; }
      canvas#game { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid #261c16; cursor: pointer; touch-action: none; }
      h1 { font-family: 'Fraunces', serif; margin: 8px 0 4px; }
      p { color: #cbbca3; margin: 0 0 16px; }
      a { color: #ff7b4f; }
      .keys { color: #9c8a74; font-size: 13px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <main>
      <a href="/">← jiro.bot</a> · <a href="../daily-roll/">Daily Roll</a>
      <h1>Sushi Rush</h1>
      <p>12-second runner stages. Every 3rd stage is a maze boss: eat 40 rice before the Giant Puffer catches you.</p>
      <canvas id="game"></canvas>
      <div class="keys">Space / ↑ / tap: jump · ↓: duck · boss: arrows / WASD / swipe · Esc: pause</div>
    </main>
    <script src="../shared/maps.js"></script>
    <script src="../shared/engine.js"></script>
    <script src="../shared/shell.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
