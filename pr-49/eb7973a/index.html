<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiro scroll buddy — interaction proof</title><style>body{margin:0;background:#161616;color:#dde1e6;font:16px/1.5 system-ui}header{position:sticky;top:0;background:#1c1c1c;padding:18px 24px;z-index:2;border-bottom:1px solid #393939}h1{font-size:22px;margin:0 0 12px}label{margin-right:24px}button,select{font:inherit;padding:6px 10px;background:#262626;color:inherit;border:1px solid #525252;border-radius:4px}main{padding:24px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}figure{margin:0;padding:16px;background:#1c1c1c;border:1px solid #393939;border-radius:6px;overflow:auto}figcaption{margin-bottom:12px}img,video{display:block;max-width:100%;width:var(--proof-width,100%);height:auto;margin:auto}p{margin:8px 0;color:#8a8f98}a{color:#6fdc8c}</style><header><h1>Jiro scroll buddy — interaction proof</h1><label>Viewport <select id="viewport"><option value="all">Both</option><option>1440</option><option>390</option></select></label><label>Image size <input id="size" type="range" min="30" max="100" value="100"></label><button onclick="location.reload()">Refresh</button><p>Real browser captures. Phone hover uses a mouse at 390px; mobile dragging uses touch events. Open an image for full resolution.</p></header><main id="proof"></main><script>fetch('manifest.json').then(r=>r.json()).then(shots=>{const render=()=>{document.querySelector('#proof').replaceChildren(...shots.filter(s=>viewport.value==='all'||s.width===+viewport.value).map(s=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),i=document.createElement(s.filename.endsWith('.mp4')?'video':'img');if(i.tagName==='VIDEO'){i.controls=true;i.loop=true;i.muted=true;}c.textContent=s.width+'px · '+s.name.replaceAll('-',' ');a.href=s.filename;i.src=s.filename;i.alt=c.textContent;a.append(i);f.append(c,i.tagName==='VIDEO'?i:a);return f}));};viewport.onchange=render;render()});size.oninput=()=>document.documentElement.style.setProperty('--proof-width',size.value+'%');</script></html>
