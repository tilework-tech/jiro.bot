<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jiro scroll buddy — interactions board</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  --k: 1;
  --ink: #173d2b; --salmon: #f2694f; --green: #3cf06e; --cream: #f8f6f0;
  --bg: #efece4; --card: #fbfaf6; --text: #173d2b; --muted: #5d6f64;
  --stage: #ffffff; --bar: #e3dfd3; --bar-strong: #c9c3b2; --line: #ddd8ca;
  --shadow: #e4e0d4; --btn: #fbd9d1;
  /* landing-page tokens for the mini scenes */
  --p-green: #3cf56a; --p-gink: #173d2b; --p-salmon: #f35b45; --p-ink: #111; --p-slate: #232629;
  --p-slate-2: #2c3034; --p-line: #3a3f44; --p-cream: #f8f6f0; --p-muted: #8b8f93;
  --sans: "Inter Tight", Inter, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
body.dark {
  --bg: #0e1f17; --card: #163628; --text: #f8f6f0; --muted: #a9bdb0;
  --stage: #1d4734; --bar: #2c5d45; --bar-strong: #3f7459; --line: #2a5340;
  --shadow: rgba(0,0,0,.35); --btn: #6b3a31;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 Inter, system-ui, sans-serif;
  transition: background .25s, color .25s;
}
.wrap { max-width: 1420px; margin: 0 auto; padding: 22px 20px 60px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 18px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { margin: 0; color: var(--muted); }
.xlink { display: inline-block; margin-top: 6px; font: 600 13px Inter, sans-serif; color: var(--salmon); text-decoration: none; }
.xlink:hover { text-decoration: underline; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.controls label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.controls input[type=range] { width: 120px; accent-color: var(--salmon); }
.speed-val { font-family: "IBM Plex Mono", monospace; color: var(--text); min-width: 38px; }
button.ctl {
  font: 600 13px Inter, sans-serif; color: var(--text); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button.ctl:hover { border-color: var(--ink); }
body.dark button.ctl:hover { border-color: var(--cream); }
button.ctl[aria-pressed=true] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
button.save { background: var(--salmon); border-color: var(--salmon); color: #fff; }
.status { font-size: 13px; color: var(--muted); min-width: 110px; }
.status.ok { color: #1f8a46; }
body.dark .status.ok { color: var(--green); }

.row { display: grid; grid-template-columns: 128px 1fr; gap: 14px; margin-bottom: 16px; }
.row-label { padding-top: 6px; }
.row-label .letter { font: 600 26px "IBM Plex Mono", monospace; color: var(--salmon); line-height: 1; }
.row-label .name { font-weight: 700; font-size: 14px; margin-top: 6px; }
.row-label .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) {
  .row { grid-template-columns: 1fr; gap: 8px; }
  .row-label { display: flex; align-items: baseline; gap: 10px; padding: 0; }
  .row-label .name, .row-label .hint { margin: 0; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); }
}

.tile {
  position: relative;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 8px; display: flex; flex-direction: column; gap: 7px; min-width: 0;
  transition: border-color .2s, box-shadow .2s;
}
.tile.starred { border-color: var(--salmon); box-shadow: 0 0 0 2px rgba(242,105,79,.25); }
.stage {
  position: relative; height: 204px; border-radius: 8px; overflow: hidden;
  background: var(--stage); border: 1px solid var(--line);
  font-family: var(--sans); color: var(--p-ink);
  user-select: none; -webkit-user-select: none;
}
.stage:focus { outline: none; }
.stage:focus-visible, .stage.kfocus { box-shadow: 0 0 0 2px var(--salmon); }
.meta { display: flex; align-items: flex-start; gap: 8px; }
.code { font: 600 12px "IBM Plex Mono", monospace; background: var(--ink); color: var(--cream); border-radius: 5px; padding: 2px 6px; flex: none; margin-top: 1px; }
body.dark .code { background: var(--cream); color: var(--ink); }
.titles { flex: 1; min-width: 0; }
.title { font-weight: 700; font-size: 13.5px; line-height: 1.3; }
.desc { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.star {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.star:hover { border-color: var(--salmon); color: var(--salmon); }
.star[aria-pressed=true] { background: var(--salmon); border-color: var(--salmon); color: #fff; }
.note {
  width: 100%; resize: vertical; min-height: 34px; height: 34px; font: 12px/1.35 Inter, sans-serif;
  color: var(--text); background: var(--stage); border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px;
}
.note:focus { outline: 2px solid var(--salmon); outline-offset: -1px; }

/* hint tab sits on the stage's bottom edge */
.hint-tab {
  position: absolute; z-index: 9; right: 16px; top: 204px;
  font: 600 9.5px/1 "IBM Plex Mono", monospace; letter-spacing: .02em;
  background: var(--ink); color: var(--cream); padding: 4px 7px 4px 6px; border-radius: 5px;
  pointer-events: none; transition: opacity .3s, background .3s; white-space: nowrap;
}
.hint-tab::before { content: ""; display: inline-block; margin-right: 5px; vertical-align: 0; border-left: 5px solid var(--green); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
body.dark .hint-tab { background: var(--cream); color: var(--ink); }
body.dark .hint-tab::before { border-left-color: #1f8a46; }
.hint-tab.used { opacity: .4; }

/* ---------- mini scene primitives (landing-page look) ---------- */
.s { position: absolute; }
.s-card { background: #fff; border: 1.5px solid var(--p-ink); }
.s-salmon { background: var(--p-salmon); }
.s-ink { background: var(--p-ink); color: #fff; }
.s-lab { font: 500 7px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.s-lab.sal { color: var(--p-salmon); }
.s-lab.lt { color: #c9cccf; }
.s-h { font-weight: 700; letter-spacing: -.045em; line-height: 1.02; }
.s-p { font-size: 9.5px; line-height: 1.45; color: #333; }
.s-tag { font-family: var(--mono); font-weight: 600; background: var(--p-green); color: var(--p-gink); padding: 0 2px; white-space: nowrap; }
.s-hl { background: var(--p-salmon); padding: 0 3px; }
.s-btn {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 10px;
  font: 500 7px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  border: 1.5px solid var(--p-ink); background: var(--p-salmon); color: var(--p-ink); padding: 6px 8px;
}
.s-bar { position: absolute; height: 5px; background: #e6e3da; border-radius: 1px; }
.hot { cursor: pointer; transition: box-shadow .15s, background .15s, color .15s; }
.hot:hover { box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--p-salmon); }
.lit, .lit:hover { box-shadow: 0 0 0 2px var(--p-green), 0 0 0 3.5px var(--p-ink) !important; }
.ping { animation: ping calc(1.7s * var(--k)) ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(243,91,69,.6); } 70% { box-shadow: 0 0 0 8px rgba(243,91,69,0); } 100% { box-shadow: 0 0 0 0 rgba(243,91,69,0); } }

/* ---------- mascot ---------- */
.m { position: absolute; left: 0; top: 0; width: 46px; height: 42px; z-index: 4; cursor: pointer; touch-action: none; outline: none; }
.m:focus-visible .m-d { filter: drop-shadow(0 0 0 var(--p-salmon)) drop-shadow(0 0 2px var(--p-salmon)); }
.m.drag { cursor: grab; }
.m.drag:active, .m.held { cursor: grabbing; }
.m-j, .m-a, .m-t, .m-c, .m-d { position: absolute; inset: 0; transform-origin: 50% 100%; }
.m-t { transform-origin: 50% 0; }
.m-c { transform-origin: 50% 60%; }
.m svg.art { display: block; width: 46px; height: 41.5px; overflow: visible; }
.m-sh { position: absolute; left: 9px; bottom: -6px; width: 28px; height: 4px; background: rgba(17,17,17,.13); border-radius: 50%; transition: opacity .2s; }
body.dark .m-sh { background: rgba(0,0,0,.35); }
.m.idle .m-a { animation: bob calc(2.6s * var(--k)) ease-in-out infinite; }
.m.idle .m-sh { animation: shadow calc(2.6s * var(--k)) ease-in-out infinite; }
.m.ping::before {
  content: ""; position: absolute; left: 3px; top: 0; width: 40px; height: 40px; border-radius: 50%;
  animation: ring calc(1.7s * var(--k)) ease-out infinite; pointer-events: none;
}
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(243,91,69,.55); } 70% { box-shadow: 0 0 0 10px rgba(243,91,69,0); } 100% { box-shadow: 0 0 0 0 rgba(243,91,69,0); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.8); opacity: .6; } }
.m .face { transition: transform .14s ease-out; }
.m .cur { animation: blink calc(1.06s * var(--k)) steps(1, end) infinite; }
.m.nocur .cur { visibility: hidden; }
@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
.m-hat, .m-sweat, .m-hand { position: absolute; display: none; pointer-events: none; }
.m-hat { left: 12px; top: -10px; width: 24px; height: 13px; }
.m-sweat { left: 39px; top: 1px; width: 6px; height: 9px; }
.m-hand { left: 39px; top: 13px; width: 11px; height: 11px; transform-origin: 10% 90%; }
.m.sushi .m-hat, .m.held .m-sweat, .m.wave .m-hand { display: block; }
.m.held .m-c { animation: dangle calc(.42s * var(--k)) ease-in-out infinite alternate; transform-origin: 50% 0; }
.m.held .m-sh { opacity: .35; }
@keyframes dangle { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.m-hat svg, .m-sweat svg, .m-hand svg { display: block; width: 100%; height: 100%; }

/* speech bubble */
.say {
  position: absolute; left: 0; top: 0; z-index: 8;
  width: max-content; max-width: 150px; padding: 5px 8px;
  background: var(--p-cream); color: var(--p-gink); border: 2px solid var(--p-gink); border-radius: 10px;
  font: 500 10.5px/1.3 var(--sans); letter-spacing: -.005em;
  opacity: 0; transform: scale(.85); transition: opacity .16s, transform .16s; pointer-events: none;
}
.say.on { opacity: 1; transform: scale(1); pointer-events: auto; }
.say-g { display: block; visibility: hidden; }
.say-t { position: absolute; left: 8px; top: 5px; right: 8px; }
.say-x { margin-top: 4px; }
.say-x.wait { visibility: hidden; }
.say-tail { position: absolute; width: 8px; height: 8px; background: var(--p-cream); border: 2px solid var(--p-gink); }
.say.sl .say-tail { left: -6px; border-right: 0; border-top: 0; transform: rotate(45deg); }
.say.sr .say-tail { right: -6px; border-left: 0; border-bottom: 0; transform: rotate(45deg); }
.say.sb .say-tail { bottom: -6px; border-left: 0; border-top: 0; transform: rotate(45deg); }
.say.st .say-tail { top: -6px; border-right: 0; border-bottom: 0; transform: rotate(45deg); }
.say .src { display: block; font: 500 7.5px/1.3 var(--mono); color: #6a756e; letter-spacing: .02em; }
.say .src::before { content: "src: "; color: var(--p-salmon); }
.say .pips { display: flex; align-items: center; gap: 3px; font: 600 7.5px/1 var(--mono); color: #6a756e; letter-spacing: .06em; }
.say .pips i { width: 6px; height: 6px; border: 1.2px solid var(--p-gink); background: transparent; }
.say .pips i.on { background: var(--p-salmon); }
.say .pips span { margin-left: 3px; }

/* chips, tabs, misc */
.chip {
  position: absolute; z-index: 9; font: 600 9.5px/1 var(--sans); color: var(--p-ink); background: #fff;
  border: 1.5px solid var(--p-ink); border-radius: 999px; padding: 4px 8px; box-shadow: 2px 2px 0 var(--p-ink);
  cursor: pointer; white-space: nowrap; transition: background .12s, transform .12s, box-shadow .12s;
}
.chip:hover { background: var(--p-green); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--p-ink); }
.chip.dark { background: var(--p-ink); color: #fff; }
.chip.dark:hover { background: var(--p-salmon); color: var(--p-ink); }
.peek {
  position: absolute; z-index: 6; bottom: -1px; font: 600 8px/1 var(--mono); letter-spacing: .12em;
  background: var(--p-cream); color: var(--p-gink); border: 1.5px solid var(--p-gink); border-bottom: 0;
  border-radius: 6px 6px 0 0; padding: 4px 8px 5px; cursor: pointer;
}
.peek:hover { background: var(--p-green); }
.px { position: absolute; width: 4px; height: 4px; z-index: 7; pointer-events: none; }
.dock { position: absolute; width: 46px; height: 42px; border: 1.5px dashed var(--bar-strong); border-radius: 10px; opacity: 0; transition: opacity .15s, border-color .15s, background .15s; }
.dock.on { opacity: 1; }
.dock.near { border-color: var(--p-salmon); background: rgba(243,91,69,.08); }
.meter { position: absolute; display: flex; gap: 3px; align-items: center; font: 600 7.5px/1 var(--mono); color: var(--muted); letter-spacing: .08em; }
.meter i { width: 7px; height: 7px; border: 1.5px solid var(--bar-strong); transition: background .12s, border-color .12s; }
.meter i.on { background: var(--p-salmon); border-color: var(--p-ink); }
.meter.angry i.on { background: var(--p-ink); }
.arrow-dn { position: absolute; z-index: 5; width: 12px; height: 14px; display: none; }
.arrow-dn.on { display: block; animation: adn calc(.6s * var(--k)) ease-in-out infinite alternate; }
@keyframes adn { from { transform: translateY(0); } to { transform: translateY(4px); } }
.flycur { position: absolute; z-index: 6; background: var(--p-salmon); pointer-events: none; }

/* scene specifics */
.tier3 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--p-ink); background: #fff; }
.tier3 > div { padding: 6px 6px 7px; position: relative; }
.tier3 > div + div { border-left: 1.5px solid var(--p-ink); }
.tier3 .feat { background: var(--p-cream); }
.tier3 .pp { display: flex; gap: 2px; margin-bottom: 14px; }
.tier3 .pp i { width: 6px; height: 6px; border: 1px solid var(--p-ink); background: var(--p-salmon); }
.tier3 .pp i.g { background: var(--p-green); }
.tier3 b { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: -.03em; }
.tier3 strong { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.055em; line-height: 1.05; }
.tier3 small { display: block; font-size: 6.5px; color: #333; }
.tier3 .mp { position: absolute; right: 4px; top: 5px; font: 500 5.5px/1 var(--mono); letter-spacing: .1em; background: var(--p-ink); color: #fff; padding: 2px 3px; }
.bake { display: grid; grid-template-columns: 34% 33% 33%; border: 1.5px solid var(--p-ink); background: #fff; font-size: 8.5px; }
.bake > div { padding: 0 5px; height: 26px; display: flex; flex-direction: column; justify-content: center; border-bottom: 1.5px solid var(--p-ink); }
.bake > div:nth-last-child(-n+3) { border-bottom: 0; }
.bake .hd { height: 20px; font-weight: 600; }
.bake .mh { font: 500 5.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
.bake .jc { background: var(--p-green); border-left: 1.5px solid var(--p-ink); border-right: 1.5px solid var(--p-ink); }
.bake .hd.jc { font-size: 11px; font-weight: 700; letter-spacing: -.04em; }
.bake .cn { font: 500 5.5px/1 var(--mono); letter-spacing: .14em; color: #777; display: block; }
.bake .ct { font-size: 8.5px; }
.bake .oc { color: #333; }
.vf { background: var(--p-slate); border: 1px solid var(--p-line); color: #fff; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.vf-bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 7px; border-bottom: 1px solid var(--p-line); font-size: 8.5px; font-weight: 600; letter-spacing: -.02em; }
.vf-split { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.vf-side { padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; position: relative; transition: box-shadow .2s; }
.vf-side + .vf-side { border-left: 1px solid var(--p-line); }
.vf-side.lit { box-shadow: inset 0 0 0 2px var(--p-green) !important; }
.vf-stat { font: 600 12px/1.1 var(--mono); letter-spacing: -.03em; }
.vf-files { font: 500 6px/1 var(--mono); color: var(--p-muted); letter-spacing: .06em; text-transform: uppercase; }
.vf-rows { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
.vf-rows i { display: block; height: 3px; background: #3a3f44; }
.vf-rows i b { display: block; height: 100%; background: var(--p-green); transform-origin: 0 50%; }
.vf-rows i b.r { background: #ff7a66; }
.vf .add { color: var(--p-green); } .vf .del { color: #ff7a66; }
.vf-play { position: absolute; left: 50%; top: 56%; width: 30px; height: 30px; margin: -15px 0 0 -15px; background: var(--p-salmon); border: 1.5px solid var(--p-ink); box-shadow: 2px 2px 0 var(--p-ink); display: grid; place-items: center; transition: opacity .15s, transform .15s; }
.vf-play::before { content: ""; border-left: 10px solid var(--p-ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.vf-play.off { opacity: 0; transform: scale(.6); }
.vf-prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--p-green); }
.slack { background: #1b1d20; border: 1px solid var(--p-line); color: #d9dcdf; font-size: 8.5px; line-height: 1.4; }
.slack-h { display: flex; justify-content: space-between; padding: 4px 7px; border-bottom: 1px solid var(--p-line); font-weight: 600; color: #fff; font-size: 9px; }
.slack-h small { font: 400 6px/1.6 var(--mono); letter-spacing: .1em; color: var(--p-muted); }
.smsg { display: grid; grid-template-columns: 14px 1fr; gap: 5px; padding: 3px 4px; margin: 2px 3px; border-radius: 3px; }
.smsg.hot:hover { background: rgba(255,255,255,.05); }
.av { width: 14px; height: 14px; border-radius: 3px; background: #6b5bd6; color: #fff; font: 700 6px/14px var(--sans); text-align: center; }
.av.j { background: var(--p-cream); }
.smsg b { color: #fff; font-size: 8px; }
.mention { color: #1d9bd1; background: rgba(29,155,209,.12); padding: 0 1px; border-radius: 2px; }
.smsg code { font: 500 7.5px var(--mono); background: #2c3034; padding: 0 2px; border-radius: 2px; color: #f2a093; }
.faq .q { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; font-weight: 600; font-size: 9.5px; letter-spacing: -.02em; }
.faq .q::after { content: "+"; color: var(--p-salmon); font: 400 10px/1 var(--mono); }
.faq .row-q { border-bottom: 1.5px solid var(--p-ink); }
.faq .row-q.open .q::after { content: "\2212"; }
.faq .a { height: 0; overflow: hidden; font-size: 8.5px; line-height: 1.4; color: #333; }
.faq .a p { margin: 0; padding: 0 2px 6px; }
.wm { position: absolute; display: flex; justify-content: center; font-family: "Silkscreen", var(--mono); line-height: .9; letter-spacing: .02em; color: var(--p-ink); white-space: nowrap; }
.wm span { display: inline-block; transform-origin: 50% 100%; cursor: pointer; transition: color .2s; }
.wm span.got { color: var(--p-cream); }
.wm span:hover { color: #fff; }
.term { background: var(--p-ink); color: var(--p-green); font: 500 9px/1 var(--mono); padding: 5px 7px; display: flex; align-items: center; gap: 1px; white-space: pre; }
.term i { width: 5px; height: 9px; background: var(--p-salmon); display: inline-block; margin-left: 1px; animation: blink calc(1.06s * var(--k)) steps(1, end) infinite; }
.key { position: absolute; width: 19px; height: 19px; border: 1.5px solid var(--p-ink); background: #fff; box-shadow: 0 2px 0 var(--p-ink); font: 600 9px/16px var(--mono); text-align: center; cursor: pointer; transition: transform .06s, box-shadow .06s, background .1s; }
.key.down { transform: translateY(2px); box-shadow: 0 0 0 var(--p-ink); background: var(--p-green); }
.key.got { background: var(--p-salmon); }
.rv input { width: 100%; border: 0; padding: 6px 7px; font: 9px var(--mono); background: #fff; color: var(--p-ink); outline: none; border-radius: 0; }

    var g = null;
    m.root.classList.add("drag");
    m.root.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      m.root.focus({ preventScroll: true });
      var p = pt(e, st);
      g = { ox: p.x - m.x, oy: p.y - m.y, sx: p.x, sy: p.y, moved: false, s: [{ x: p.x, y: p.y, t: performance.now() }], vx: 0, vy: 0 };
      m.root.setPointerCapture(e.pointerId);

    });
    m.root.addEventListener("pointermove", function (e) {
      if (!g) return;
      var p = pt(e, st), now = performance.now();
      if (!g.moved && Math.hypot(p.x - g.sx, p.y - g.sy) < 4) return;
      if (!g.moved) { g.moved = true; m.root.classList.remove("idle"); hush(m); if (hd.start) hd.start(g); }
      g.s.push({ x: p.x, y: p.y, t: now });
      while (g.s.length > 2 && now - g.s[0].t > 90) g.s.shift();
      var a = g.s[0], z = g.s[g.s.length - 1], dt = Math.max(8, z.t - a.t);
      g.vx = (z.x - a.x) / dt; g.vy = (z.y - a.y) / dt;
      var SW = st.clientWidth, SH = st.clientHeight;
      m.place(clamp(p.x - g.ox, 0, SW - MW), clamp(p.y - g.oy, 0, SH - MH - 4));
      if (hd.move) hd.move(g);
    });

      if (!g) return;
      var gg = g; g = null;
      if (performance.now() - gg.s[gg.s.length - 1].t > 90) { gg.vx = 0; gg.vy = 0; }
      if (gg.moved) { if (hd.end) hd.end(gg); } else if (hd.tap) hd.tap(gg);

    TILES.filter(function (t) { return t.code[0] === row.id; }).forEach(function (t) {
      var tile = h("article", "tile t" + t.code, grid);
      tile.dataset.code = t.code;
      t.el = tile;
      t.stage = h("div", "stage", tile);
      t.hintEl = h("div", "hint-tab", tile, t.hint);
      var meta = h("div", "meta", tile);
      h("span", "code", meta, t.code);
      var titles = h("div", "titles", meta);
      h("div", "title", titles, t.title);
      h("div", "desc", titles, t.desc);
      var star = h("button", "star", meta);
      star.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
      star.setAttribute("aria-pressed", "false");
      star.title = "Star " + t.code;
      star.addEventListener("click", function () { setStar(t.code, star.getAttribute("aria-pressed") !== "true"); markDirty(); });
      var note = h("textarea", "note", tile);
      note.placeholder = "Notes on " + t.code + "…";
      note.addEventListener("input", markDirty);
      t.star = star; t.note = note;
      tileEls[t.code] = t;
    });
  });

  function setStar(code, on) {
    var t = tileEls[code];
    if (!t) return;
    t.star.setAttribute("aria-pressed", on ? "true" : "false");
    t.el.classList.toggle("starred", on);
  }

  function start(t) {
    t.gen = (t.gen || 0) + 1;
    var gen = t.gen;
    var fresh = t.stage.cloneNode(false);
    fresh.removeAttribute("tabindex"); fresh.removeAttribute("aria-label"); fresh.className = "stage";
    t.stage.replaceWith(fresh);
    t.stage = fresh;
    t.hintEl.classList.remove("used");
    delete selHandlers[t.code];
    t.width = fresh.clientWidth;
    var pings = [];
    var T = {
      ctx: { dead: function () { return t.gen !== gen; } },
      tile: t.el,
      ping: function (el) { el.classList.add("ping"); pings.push(el); },
      used: function () { t.hintEl.classList.add("used"); pings.forEach(function (el) { el.classList.remove("ping"); }); pings = []; },
      onSelection: function (fn) { selHandlers[t.code] = fn; }
    };
    t.setup(fresh, T);
  }
  function startAll() {
    live.forEach(function (a) { a.cancel(); });
    live.clear();
    TILES.forEach(start);
  }

  document.addEventListener("selectionchange", function () {
    var sel = document.getSelection();
    Object.keys(selHandlers).forEach(function (k) { selHandlers[k](sel); });
  });

  var speedEl = document.getElementById("speed");
  speedEl.addEventListener("input", function () {
    speed = parseFloat(speedEl.value);
    document.getElementById("speedVal").textContent = speed.toFixed(1) + "x";
    document.documentElement.style.setProperty("--k", (1 / speed).toFixed(3));
    live.forEach(function (a) { a.playbackRate = speed; });
  });
  var pauseBtn = document.getElementById("pause");
  pauseBtn.addEventListener("click", function () {
    paused = !paused;
    pauseBtn.setAttribute("aria-pressed", String(paused));
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    document.body.classList.toggle("paused", paused);
    live.forEach(function (a) { if (paused) a.pause(); else a.play(); });
  });
  document.getElementById("replay").addEventListener("click", startAll);
  var themeBtn = document.getElementById("theme");
  themeBtn.addEventListener("click", function () {
    var dark = !document.body.classList.contains("dark");
    document.body.classList.toggle("dark", dark);
    themeBtn.setAttribute("aria-pressed", String(dark));
    themeBtn.textContent = dark ? "Light background" : "Dark background";
  });

  var PICKS = "picks-interactions.json";
  document.getElementById("save").addEventListener("click", function () {
    var stars = [], notes = {};
    TILES.forEach(function (t) {
      if (t.star.getAttribute("aria-pressed") === "true") stars.push(t.code);
      if (t.note.value.trim()) notes[t.code] = t.note.value;
    });
    setStatus("Saving…");
    fetch(PICKS, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ stars: stars, notes: notes, savedAt: new Date().toISOString() }) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); dirty = false; setStatus("Saved ✓", true); })
      .catch(function (e) { setStatus("Save failed: " + e.message); });
  });

  fetch(PICKS, { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (data) {
      (data.stars || []).forEach(function (c) { setStar(c, true); });
      Object.keys(data.notes || {}).forEach(function (c) { if (tileEls[c]) tileEls[c].note.value = data.notes[c]; });
      if (data.savedAt) setStatus("Loaded save from " + new Date(data.savedAt).toLocaleString(), true);
    })
    .catch(function () {});

  var resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      TILES.forEach(function (t) { if (Math.abs(t.stage.clientWidth - t.width) > 16) start(t); });
    }, 250);
  });
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(startAll);
})();
</script>
</body>
</html>
