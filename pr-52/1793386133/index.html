<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tier 1 pr2 visual proof</title><style>body{font:16px system-ui;margin:24px;background:#f2f4f8;color:#161616}header{position:sticky;top:0;background:#f2f4f8;padding:12px 0;border-bottom:1px solid #c1c7cd}select,input{margin:8px;font:inherit}figure{margin:24px 0}img{display:block;max-width:100%;height:auto;border:1px solid #c1c7cd}figcaption{padding:8px 0;font-weight:600}.hide{display:none}</style><header><h1>Tier 1 pr2 proof</h1><p>Actual local site captures at desktop 1440 and mobile 390. Static captures use reduced motion; animation and keyboard behavior are verified by the browser suite.</p><label>Viewport<select id="width"><option value="all">Both</option><option>1440</option><option>390</option></select></label><label>Section<select id="section"><option value="all">All</option><option>testimonials</option><option>signup</option></select></label><label>Display width<input id="size" type="range" min="320" max="1440" value="1000"></label></header><main><figure data-width="1440" data-name="testimonials"><figcaption>1440px · testimonials</figcaption><a href="1440-testimonials.png"><img src="1440-testimonials.png" loading="lazy" style="width:1000px"></a></figure><figure data-width="1440" data-name="signup"><figcaption>1440px · signup</figcaption><a href="1440-signup.png"><img src="1440-signup.png" loading="lazy" style="width:1000px"></a></figure><figure data-width="390" data-name="testimonials"><figcaption>390px · testimonials</figcaption><a href="390-testimonials.png"><img src="390-testimonials.png" loading="lazy" style="width:1000px"></a></figure><figure data-width="390" data-name="signup"><figcaption>390px · signup</figcaption><a href="390-signup.png"><img src="390-signup.png" loading="lazy" style="width:1000px"></a></figure></main><script>const w=document.querySelector('#width'),s=document.querySelector('#section'),z=document.querySelector('#size');function update(){document.querySelectorAll('figure').forEach(f=>{f.classList.toggle('hide',(w.value!=='all'&&w.value!==f.dataset.width)||(s.value!=='all'&&s.value!==f.dataset.name));f.querySelector('img').style.width=z.value+'px'})}w.onchange=s.onchange=z.oninput=update;</script>
