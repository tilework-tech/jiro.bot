<!doctype html>
<html lang="en">

  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17120e; color: #f2e7d7; }

    figure { margin: 0; background: #251c16; border: 1px solid #493528; border-radius: 12px; overflow: hidden; }
    video, img { display: block; width: 100%; background: #100c09; }

    .overview { margin-top: 24px; }

<body><main>

    <figure><video src="../v/s0-hero.mp4" poster="../p/s0-hero.jpg" autoplay muted loop playsinline controls></video><figcaption>Hero bar</figcaption></figure>
