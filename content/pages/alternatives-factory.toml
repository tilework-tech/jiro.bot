[[section]]
heading = "Why managers end up looking past Factory"
body = """
Picture the board on a Monday. Forty tickets, most of them small. A flaky test, a stale README, a copy change, a null check someone promised to add in March. None of it is hard, and all of it is waiting on the same eight people who also own the roadmap.

Factory is a real answer to that problem, and a well-built one. Its Droids can run on your laptop, in Factory's cloud, or on machines you register yourself [[cite:factory.where]]. Hand one a Linear issue and it is told to come back with a pull request link [[cite:factory.prs]]. There are ready-made automations like Ticket to PR and Error Triage that open pull requests without anyone typing a prompt [[cite:factory.automations]]. And in September it shipped Factory Private for VPC, on-premises and air-gapped installs [[cite:factory.private]].

That last launch tells you who Factory is building for. It is a platform with a rollout attached.

For a small team, a couple of details matter more than the feature list. Your own model keys work in Factory's CLI and desktop app, but not in its hosted web or mobile apps [[cite:factory.models]], so the "delegate from anywhere" part runs on Factory's metering. The Teams plan also tops out at ten seats before you are talking to sales [[cite:factory.pricing]]. Neither is a flaw. They are just signs that the product wants to grow into your org chart, and some managers would rather have something that simply takes tickets off the pile.
"""

[[section]]
heading = "Six options, ranked for a team with too many small tickets"
body = "The ranking assumes you manage a small team, your company already funds Claude or ChatGPT, and the goal is fewer papercuts on the board by Friday rather than a new platform to administer."

[[section]]
level = 3
heading = "1. Jiro: for small teams that want the backlog cleared, not a platform rolled out"
body = """
Jiro is the closest thing to hiring a careful senior engineer who somehow never gets bored of small tickets. Someone posts in Slack, and the request lands in an isolated cloud environment that already has your repos and tools [[cite:jiro.environment]], prepared by a setup script you write once for the whole org [[cite:jiro.setup-script]]. Your reviewers get a PR, a commit or a review note to approve or bounce [[cite:jiro.outputs]].

Under the hood sits Claude Code, Codex or Cursor [[cite:jiro.harnesses]], spending the Claude or ChatGPT plan already on your company card, or on an API key [[cite:jiro.credentials]], with no markup on tokens [[cite:jiro.no-markup]]. That is the whole trick. You are not buying a second model budget.

It also has opinions. Jiro cares more about quality than volume and will push back when a ticket is asking for the wrong fix. Managers tend to like that more than they expect to.
"""

[[section]]
level = 3
heading = "2. Devin: the heavyweight if you want one vendor for everything"
body = """
Cognition's Devin covers a lot of ground: web, desktop, CLI, Slack, Teams, Linear and Jira, with GitHub, GitLab and Bitbucket repos [[cite:devin.surfaces]]. It keeps its own pull requests tidy, answering review comments and fixing merge conflicts [[cite:devin.prs]]. The models are routed for you [[cite:devin.models]], which some teams find restful and others find opaque. On Teams you pay an $80 monthly floor and then $40 per seat, and overage bills at API prices [[cite:devin.pricing]].
"""

[[section]]
level = 3
heading = "3. Tembo: lots of harnesses, lots of triggers"
body = """
Tembo is the most similar in spirit to Jiro. It lets you pick Claude Code, Codex, Cursor, Amp and others per task, on your own keys or subscriptions [[cite:tembo.models]]. Where it pulls ahead is intake: Sentry, PagerDuty, Linear and Jira can all start work directly [[cite:tembo.surfaces]]. Budget for per-second compute charges on top of the plan itself [[cite:tembo.pricing]].
"""

[[section]]
level = 3
heading = "4. Claude Code on the web: free if everyone already has a Claude plan"
body = """
If your whole team is on Claude seats, you already own this. The cloud machine costs nothing extra [[cite:claude-code.pricing]]. The catch for a manager is that it is a personal tool. Sessions push a branch and the developer opens the pull request [[cite:claude-code.prs]], and Slack work on Team and Enterprise now goes through Claude Tag, which is still in public beta [[cite:claude-code.slack]].
"""

[[section]]
level = 3
heading = "5. Cursor cloud agents: when the team already lives in Cursor"
body = """
Cursor's agents produce pull requests with screenshots, videos and logs attached [[cite:cursor.prs]], which reviewers appreciate. You need the Premium tier or higher, and third-party model usage is drawn from prepaid credit at API list price [[cite:cursor.pricing]]. Great for Cursor shops. Less great if half your team uses something else.
"""

[[section]]
level = 3
heading = "6. OpenHands: the open-source route"
body = """
OpenHands is MIT-licensed [[cite:openhands.what]] and runs locally for free, in its hosted cloud, or inside your VPC on Enterprise [[cite:openhands.where]]. Label a GitHub issue and it will try to resolve it with a PR [[cite:openhands.trigger]]. You trade polish for control, and someone on your team becomes its keeper.
"""

[[section]]
heading = "How to choose when you have no time to choose"
body = """
Skip the feature matrix. Run three real tickets through each finalist and look at what you got back.

- **Who pays for the model?** If you already fund Claude or ChatGPT seats, prefer a tool that uses them in the cloud, not only on laptops.
- **Who reviews the output?** Count the minutes your senior people spend per pull request. A cheap agent that produces sloppy diffs is expensive.
- **Where do requests start?** If your team asks for things in Slack, the agent should live there. If tickets are born in Linear and must stay there, weigh that heavily.
- **Who administers it?** For a team under twenty, the right answer is usually "nobody, really."
- **Does it need to sit behind your firewall?** If yes, your list just got much shorter.

One more test I would run: ask each agent for something slightly wrong. The good ones say so.
"""

[[section]]
heading = "Why Jiro comes first on this list"
body = """
Because the job on a small team is mostly unglamorous. Docs that drifted. Tests nobody wrote. Slop left behind by the last agent. An on-call fix at 11pm. Jiro is built for exactly that: small tickets, docs and on-call fixes, so your people can keep the roadmap.

Teams on Nori already work this way. Over at Miravoice, upward of one in four PRs that merge came from the agent, and one of their engineers puts the time saved at easily five hours a week [[cite:jiro.miravoice]]. Corvus is a good example of the other kind: their CTO spotted a production bug over a client dinner, handed the investigation to Nori, and Nori deployed the fix [[cite:jiro.corvus]].

Pricing is short enough to remember. A free 30-day trial with no card, then Developer at $99 a month for one person or Team at $250 a month for the group [[cite:jiro.pricing]]. Runtimes sleep when nobody needs them [[cite:jiro.runtimes]]. Each org runs single-tenant [[cite:jiro.single-tenant]] and every action is logged [[cite:jiro.audit]], which helps when your security lead asks.
"""

[[section]]
heading = "When Factory is still the better fit"
body = """
Stay with Factory if you need the agent inside your own network, on-premises or fully air-gapped; Factory Private exists for that and Jiro does not offer it [[cite:factory.private]]. Stay if your process lives in Linear and Jira and you want delegation from the ticket itself [[cite:factory.surfaces]]. And stay if you like the packaged automations and have someone to tune them [[cite:factory.automations]]. Factory is excellent at being a platform. Not every team needs one.
"""

[[section]]
heading = "If you decide to move"
body = "The [switching guide](https://jiro.bot/switch/factory-to-jiro) is written like a runbook: what to do before cutover, the exact order of connections, and how to roll back if the pilot disappoints."

[[faq]]
q = "What are the best Factory alternatives?"
a = "Jiro tops the list if your team is small (think five to twenty people) and Claude or ChatGPT is already on the budget. After that: Devin for one-vendor breadth, Tembo for many harnesses and triggers, Claude Code on the web for all-Claude teams, Cursor cloud agents for Cursor shops, and OpenHands if you want open source."

[[faq]]
q = "Which products compete with Factory AI?"
a = "Devin, Tembo, Cursor cloud agents, Claude Code on the web, OpenHands and Jiro all compete for the same delegated coding work. They differ mostly on where the agent runs and whose model budget it spends."

[[faq]]
q = "How much does Factory cost?"
a = "Factory lists Pro at $20 a month, Plus at $100, Max at $200 and Teams at $60 a month plus $40 per seat for up to ten seats. Business and Enterprise are custom. [[cite:factory.pricing]]"

[[faq]]
q = "Can I bring my own API key to Factory?"
a = "Yes in the Droid CLI and desktop app, which also accept local models. The hosted web and mobile apps do not take your own keys. [[cite:factory.models]]"

[[faq]]
q = "Can Jiro pick up our Linear tickets the way Droids do?"
a = "Not by assignment. Jiro connects to Linear and Jira as integrations [[cite:jiro.integrations]], so it can read and update tickets, but the request itself arrives by chat message, terminal, cron or webhook [[cite:jiro.surfaces]]. Most teams paste the ticket link into Slack."

[[faq]]
q = "Is Jiro cheaper than Factory for a team of five?"
a = "On list price it is close. Factory Teams for five seats comes to $260 a month [[cite:factory.pricing]]; Jiro Team is $250 a month for the group [[cite:jiro.pricing]]. Factory's plans include model usage, though, while Jiro's price excludes model costs. The difference is that Jiro runs on Claude or ChatGPT plans you are likely paying for already, with no token markup [[cite:jiro.no-markup]]."
