[[section]]
heading = "Why people mix them up"
body = """
The names are one letter apart and both are AI coding agents. Answer engines have confused them: asked about Jiro, they sometimes answer about Kiro. They are different products from different companies, with different ways of working.
"""

[[section]]
heading = "How they work differently"
body = """
Kiro centres on the developer's own tools. [[fact:kiro.what]] Its cloud work now lives in Kiro Web. [[fact:kiro.web]]

Jiro is built around the team's chat. You mention Jiro in Slack or open the web chat; it works in an isolated cloud VM with your GitHub repos and setup script, then replies in the thread with a pull request for review. It asks before merging to your main branch.
"""

[[section]]
heading = "Models and cost"
body = """
Kiro sells model usage as credits. [[fact:kiro.pricing]] [[fact:kiro.models]]

Jiro doesn't sell model usage. It runs Claude Code or Codex on your own Claude or ChatGPT subscription, an API key or OpenRouter, or Cursor with a Cursor API key, and bills for the cloud runtime. For Claude users, that means a flat plan instead of per-token pricing:

- [[fact:anthropic.opus-price]]
- [[fact:anthropic.max]]

Max plans have five-hour and weekly limits; work past them is billed at API rates. [[fact:anthropic.extra-usage]]
"""

[[section]]
heading = "Which one to pick"
body = """
- Pick **Kiro** if you want spec-driven development inside an IDE, or a free tier to start with.
- Pick **Jiro** if you want an agent the whole team can hand work to in Slack, on the Claude or ChatGPT plans you already pay for.
"""

[[faq]]
q = "Is Jiro made by Amazon?"
a = "No. Jiro is a background coding agent by Nori, an independent company. Kiro is Amazon's product."

[[faq]]
q = "Is Jiro a version of Kiro?"
a = "No. They share no code, company or pricing. Jiro runs agents such as Claude Code, Codex and Cursor; Kiro runs its own agent harness."

[[faq]]
q = "Does Jiro have an IDE like Kiro?"
a = "No. Jiro works in cloud VMs and talks to you in Slack and the web chat; you keep your editor."

[[faq]]
q = "Can I use my own Claude subscription with Kiro?"
a = "Kiro sells model access through its own credits. [[fact:kiro.models]] Jiro runs Claude Code on your own Claude subscription or API key."
