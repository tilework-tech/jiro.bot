[[section]]
heading = "Are Jiro and Kiro the same company?"
body = """
No. This is the most common mix-up, so it comes first.

Kiro belongs to Amazon. Jiro belongs to Nori, a much smaller company. The names sound alike by accident. There is no partnership, no shared technology, and no shared account between them.

If you were looking for Amazon's product, you want kiro.dev. If you were looking for us, you're in the right place.
"""

[[section]]
heading = "What does Kiro do, in plain terms?"
body = """
Kiro is a tool that helps developers write software with AI. Its big idea is called spec-driven development. Before any code gets written, you and the AI agree on a written plan for what to build and how [[cite:kiro.what]].

Think of it like an architect drawing blueprints before the builders arrive.

Developers can use it inside a code editor, at the command line, in a web browser or on an iPhone [[cite:kiro.surfaces]]. Since May 2026 there is also a web version that can work on its own in the background, though it is still labelled a preview [[cite:kiro.web]].
"""

[[section]]
heading = "What does Jiro do, in plain terms?"
body = """
Jiro is closer to a colleague you can send a message to. Someone on your team writes "@Jiro please fix the broken signup email" in Slack, and Jiro goes off and does it.

It works on its own computer in the cloud, which already has your company's code and tools set up [[cite:jiro.environment]]. When it's done, it sends back a pull request. That is simply a proposed change that a person on your team reads and approves before it goes live [[cite:jiro.outputs]].

Nobody has to keep a laptop open. Jiro can also run on a schedule, say every Monday morning, or when another system pings it [[cite:jiro.triggers]].
"""

[[section]]
heading = "How is paying for each one different?"
body = """
This is the part buyers usually care about most.

With Kiro, you buy a Kiro plan, and AI usage comes out of Kiro's own credits [[cite:kiro.models]]. Plans go from free, with 50 credits, up to $200 a month, and the background web version needs a paid plan [[cite:kiro.pricing]].

With Jiro, you pay Nori a flat monthly fee, and the AI itself runs on an account you probably already have with Anthropic (Claude) or OpenAI (ChatGPT) [[cite:jiro.credentials]]. Nori doesn't add a markup to that usage [[cite:jiro.no-markup]]. The fee is $99 a month for one person or $250 a month for a team, after a 30-day free trial that doesn't ask for a card [[cite:jiro.pricing]].

So which is cheaper? For one developer who just wants an AI helper in their editor, Kiro's $20 Pro plan will usually cost less than Jiro plus a Claude subscription. For a team of ten that already pays for Claude, adding Jiro can be cheaper than buying everyone a second AI plan, because you aren't paying for the same models twice.
"""

[[section]]
heading = "Which one is better at what?"
body = """
Kiro is stronger when:

- the work is large and needs careful planning first;
- a developer wants to stay inside a code editor all day;
- you'd rather buy AI usage from one place and not manage separate model accounts.

Jiro is stronger when:

- the work is a steady stream of small jobs, like fixing bugs, writing docs or filling in missing tests;
- your team already talks in Slack and wants to hand work off there;
- you already pay for Claude or ChatGPT and want to use that plan rather than buy credits elsewhere;
- you want to switch between Claude Code, Codex and Cursor without changing tools [[cite:jiro.harnesses]].
"""

[[section]]
heading = "Who should buy which?"
body = """
Pick Kiro if you are a developer, or a team of developers, who wants a structured planning process built into the tools you code in, and you're comfortable with Amazon as the vendor.

Pick Jiro if you lead a small engineering group, roughly five to twenty people, that already pays for Claude or ChatGPT and keeps running out of hours for the small stuff.

A real example helps here. At Miravoice, a Nori customer, the agent now produces over a quarter of the pull requests that get merged [[cite:jiro.miravoice]]. They got it running from their phones [[cite:jiro.phone]].
"""

[[faq]]
q = "Is Jiro made by Amazon?"
a = "No. Kiro is made by Amazon. Jiro is made by Nori. This site also has no connection to any other software that happens to be called Jiro."

[[faq]]
q = "Is Jiro a version of Kiro, or the other way around?"
a = "Neither. They were built separately, they work differently, and you'd sign up for each one on its own."

[[faq]]
q = "What is a background coding agent?"
a = "It's an AI helper that works on code while you do something else. You describe the job, it goes away and does it on a computer in the cloud, and later you get back a finished change to check. Jiro works this way, and Kiro Web added a similar background mode in 2026 [[cite:kiro.web]]."

[[faq]]
q = "Which AI models can each one use?"
a = "Kiro offers Claude, GPT-5.6 and some open models, all paid through Kiro [[cite:kiro.models]]. Jiro runs three popular coding tools, Claude Code, Codex and Cursor, which use Anthropic, OpenAI and Cursor accounts respectively [[cite:jiro.harnesses]]."

[[faq]]
q = "Can I use both at the same time?"
a = "Yes. Some developers could plan bigger features in Kiro and let Jiro pick up small tickets from Slack. They don't share accounts or settings, so you'd set each up separately."

[[faq]]
q = "Do I need to be technical to use Jiro?"
a = "Someone technical should do the initial setup, which means connecting your GitHub code and your AI account. After that, anyone on the team can ask for work in plain English in Slack, and an engineer reviews the result before it ships."

[[faq]]
q = "Does Kiro let me use my existing Claude subscription?"
a = "Kiro sells model access through its own credits, and its terms don't allow sending its requests through other tools [[cite:kiro.models]]. Jiro is built the other way round: your Claude or ChatGPT plan is the engine."

[[faq]]
q = "Which is safer for company code?"
a = "Both open proposed changes for a human to review rather than shipping straight to production; Kiro, for example, won't merge its own changes [[cite:kiro.prs]]. Jiro gives each company its own separate setup [[cite:jiro.single-tenant]] and keeps a log of every action it takes [[cite:jiro.audit]]."
