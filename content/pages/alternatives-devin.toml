[[section]]
heading = "Why people go shopping after a Devin invoice"
body = """
Devin is not expensive per seat. A Teams plan starts at an $80 monthly floor plus $40 a seat, and Pro is $20. [[cite:devin.pricing]] The number that surprises people is the other one: anything past the quota is billed at API pricing. [[cite:devin.pricing]] Your Anthropic and OpenAI usage gets resold to you through Cognition's router, at list.

That is a reasonable business. It is also a second model bill for any team that already pays Anthropic or OpenAI directly.

Some history, because the plans keep moving. Cognition dropped the ACU-based Core and Team plans for quota plans on 2026-04-14. [[cite:devin.plans-change]] Windsurf turned into Devin Desktop that June. [[cite:devin.desktop]] Devin can now link a ChatGPT plan, but only for the GPT share of usage; the Claude and Gemini traffic still goes through Cognition. [[cite:devin.models]] The planning side of the agent stays in Cognition's cloud even on the single-tenant Enterprise deployment. [[cite:devin.enterprise]]

Devin is still good at a lot. It is a capable agent that maintains its own pull requests, stacks large changes and resolves its own merge conflicts. [[cite:devin.prs]] The question is narrower. Do you want to pay twice for the same model?
"""

[[section]]
heading = "The eight options, ranked for small teams"
body = "Ranked for a team of 5 to 20 engineers on GitHub that already has at least one frontier model subscription. Bigger organisations will order this differently, and should."

[[section]]
level = 3
heading = "1. Jiro, when the model bill already exists"
body = """
Jiro runs Claude Code, Codex or Cursor as the agent, on your Claude or ChatGPT login, an API key, or a Cursor key. [[cite:jiro.harnesses]] [[cite:jiro.credentials]] There is no markup on tokens. [[cite:jiro.no-markup]] You pay Nori for runtimes, which sleep when nobody is using them. [[cite:jiro.runtimes]]

Each conversation gets its own cloud machine with your repos and whatever your org setup script installs. [[cite:jiro.environment]] [[cite:jiro.setup-script]] Work comes back as a pull request your team reviews. [[cite:jiro.outputs]]
"""

[[section]]
level = 3
heading = "2. Cursor cloud agents, for teams who live in Cursor"
body = """
Polished, and the PRs arrive with screenshots and video. [[cite:cursor.prs]] The catch is billing. Every cloud-agent run meters at list API rates, and custom keys never get past the chat models. [[cite:cursor.models]] Cloud agents need the $30 Premium tier or higher. [[cite:cursor.pricing]]
"""

[[section]]
level = 3
heading = "3. OpenAI Codex cloud, the cheapest door for ChatGPT shops"
body = """
Codex cloud is bundled from ChatGPT Plus at $20 a month. [[cite:codex.pricing]] It runs OpenAI models only, and an API key does not unlock the cloud features. [[cite:codex.models]] You open the PR yourself. [[cite:codex.prs]]
"""

[[section]]
level = 3
heading = "4. Claude Code on the web, for individuals on a Claude plan"
body = """
No separate charge for the cloud machine; it comes with Pro, Max and Team seats. [[cite:claude-code.pricing]] Sessions push a branch and leave the pull request to you. [[cite:claude-code.prs]] Team Slack work has moved to Claude Tag. [[cite:claude-code.slack]]
"""

[[section]]
level = 3
heading = "5. Factory, if you want the whole platform"
body = """
Factory's Droids run locally, on Factory cloud machines, or on hardware you register. [[cite:factory.where]] Its Teams plan is $60 plus $40 per seat, capped at ten seats. [[cite:factory.pricing]] Bring-your-own-key is limited to its CLI and desktop app; the hosted web app won't take one. [[cite:factory.models]] More moving parts than most five-person teams need.
"""

[[section]]
level = 3
heading = "6. GitHub Copilot cloud agent, the default nobody had to approve"
body = """
If procurement already bought Copilot, this is the path of least paperwork. Each session lives on a GitHub Actions runner and gets cut off at the 59-minute mark. [[cite:copilot.where]] Usage has been metered in AI Credits since June. [[cite:copilot.billing]]
"""

[[section]]
level = 3
heading = "7. Tembo, a multi-harness cousin"
body = """
Tembo also runs several harnesses and takes your own subscriptions. [[cite:tembo.models]] Pro is $60 a month, and compute is billed by the second on top. [[cite:tembo.pricing]]
"""

[[section]]
level = 3
heading = "8. OpenHands, for people who want the source"
body = """
MIT-licensed. [[cite:openhands.what]] Free to run locally, and you can self-host it in your VPC on Enterprise. [[cite:openhands.where]] You will be the one keeping it running, which is the point and also the cost.
"""

[[section]]
heading = "Choosing without a spreadsheet war"
body = """
Four questions settle most of this. Ask them in order and stop when one answer rules a product out.

- Do you already pay for Claude or ChatGPT seats, and would you rather use those than buy model access again?
- Where does the team actually ask for work: Slack, the IDE, GitHub issues, or a cron job at 3 a.m.?
- Does the agent need a real machine with your toolchain, or will a short-lived sandbox do?
- Who reviews the output, and does the agent return a ready PR or merely a branch somebody must still wrap up?

If the answers are "yes, Slack, real machine, finished PR", you have more or less described Jiro. If they are "no, the IDE, sandbox is fine, branch is fine", Codex cloud, or Anthropic's hosted Claude Code sessions, will cost you less.
"""

[[section]]
heading = "Why Jiro takes the top slot"
body = """
Arithmetic, mostly. Team costs $250 monthly, with five runtimes shared across however many people you add. Developer is $99 for one person and up to three runtimes. [[cite:jiro.pricing]] The trial is 30 days with no card. Models are whatever your team already pays Anthropic or OpenAI for. Nobody is reselling you tokens.

Then there is the work itself. Jiro aims for the diff you'd have written yourself on a sharp day rather than for volume, and it will push back when a ticket is a bad idea. Teams on Nori use it for the queue nobody volunteers for: small tickets, docs, test gaps, on-call fixes. At Miravoice it now accounts for over a quarter of merged pull requests and saves an engineer about five hours a week. [[cite:jiro.miravoice]] Corvus's CTO saw a production bug at a client dinner, had Nori look into it, and Nori deployed the fix. [[cite:jiro.corvus]]

Anyone can kick it off with a Slack mention, from the browser or Discord, inside Handroll, or by cron and webhook. [[cite:jiro.surfaces]] Every action is logged. [[cite:jiro.audit]]
"""

[[section]]
heading = "When staying on Devin is the sensible call"
body = """
Stay if you rely on Microsoft Teams, GitLab or Bitbucket. [[cite:devin.surfaces]] Stay if Linear and GitHub events already kick off Devin sessions and that plumbing works. [[cite:devin.automations]] Stay if you want one vendor to own the agent, the routing and the model bill, and you are happy to pay for that convenience.

And stay if you need a dedicated VPC deployment. [[cite:devin.enterprise]] Jiro is single-tenant per organisation on Nori's hosting, which is not the same thing. [[cite:jiro.single-tenant]]
"""

[[section]]
heading = "Moving over"
body = """
Leaving Devin takes an afternoon, not a migration project; Knowledge entries need copying by hand. Our [notes on moving from Devin](https://jiro.bot/switch/devin-to-jiro) walk through the order of operations, including the Claude sign-in step people skip.
"""

[[faq]]
q = "What are the best Devin alternatives?"
a = "For a 5–20 engineer team already paying for Claude or ChatGPT, Jiro. Beyond that: Cursor cloud agents for Cursor users, Codex cloud for ChatGPT-only shops, Claude Code on the web for individuals, Factory for a full platform, Copilot cloud agent for GitHub-first orgs, Tembo, and OpenHands if you want open source."

[[faq]]
q = "Who competes with Devin?"
a = "Cursor, OpenAI with Codex cloud, Anthropic with Claude Code on the web and Claude Tag, GitHub with Copilot cloud agent, Factory, Tembo, OpenHands and Jiro. Each sells a different slice: some resell models, some only run on yours."

[[faq]]
q = "How much does Devin cost?"
a = "Free; $20 monthly for Pro; $200 for Max; and Teams at $80 a month at minimum, then $40 for each seat, with usage past the quota at API pricing. Enterprise is billed in ACUs. [[cite:devin.pricing]]"

[[faq]]
q = "Does Devin still use ACUs?"
a = "Only on Enterprise. Self-serve plans moved from ACUs to quotas on 2026-04-14. [[cite:devin.plans-change]] [[cite:devin.pricing]]"

[[faq]]
q = "Can I use my Claude Max subscription instead of paying Devin for tokens?"
a = "Not in Devin; plan linking covers ChatGPT for the GPT share only. [[cite:devin.models]] In Jiro, yes: generate a token with `claude setup-token` on your own machine, which binds it to whichever Claude plan you hold, Pro up to Enterprise, then connect it. [[cite:anthropic.setup-token]] [[cite:jiro.credentials]]"

[[faq]]
q = "Is Windsurf part of Devin now?"
a = "Yes. Windsurf became Devin Desktop on 2026-06-02. [[cite:devin.desktop]]"
