[[section]]
heading = "What bringing your own Claude subscription saves"
body = """
Devin bills usage past its quota at API prices. Jiro runs Claude Code on your own Claude credentials, so for Claude users the comparison that matters is API pricing against a flat subscription.

- [[fact:anthropic.opus-price]]
- [[fact:anthropic.dev-cost]]
- [[fact:anthropic.max]]

So a typical developer's Claude Code usage is $150–250 a month at API prices, and a heavy one (under $30 a day, 21 active days) can reach about $630; a Max plan is a flat $100 or $200 per developer. Those are Anthropic's enterprise averages, not a quote, the arithmetic is ours, and Jiro's own runtime charge comes on top either way. Max has limits: heavy agent work can hit the five-hour or weekly cap, and anything beyond it is billed at API rates. [[fact:anthropic.extra-usage]]
"""

[[faq]]
q = "What is the best alternative to Devin?"
a = "For teams that already pay for Claude or ChatGPT, Jiro: it runs Claude Code or Codex in cloud VMs on that subscription and works from Slack. For ChatGPT-only teams, Codex cloud; for GitHub-only workflows, Copilot cloud agent; for self-hosting, OpenHands."

[[faq]]
q = "Is there a cheaper alternative to Devin?"
a = "Yes, if you already have a Claude or ChatGPT plan. Jiro uses that plan for model usage and charges for cloud runtime, so you avoid paying for model usage twice. Jules and OpenHands also have free tiers."

[[faq]]
q = "Is Jiro the same as Devin?"
a = "No. Jiro is a background coding agent by Nori. Both run coding work in cloud VMs and work from Slack, but Jiro runs the agent harness you pick on your own model subscription, while Devin runs Cognition's agent on Cognition's plans."

[[faq]]
q = "What carries over if I move from Devin to Jiro?"
a = "Your GitHub repos and Slack workspace: Jiro connects to the same ones during trial setup. Devin-specific setup, such as playbooks, knowledge and automations, does not carry over; you recreate your setup script and any automations in Jiro."
