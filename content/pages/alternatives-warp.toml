[[section]]
heading = "Two products called Warp"
body = """
[[fact:warp.what]] Many people searching for Warp alternatives want a terminal. If that is you, the usual picks are:

- [[fact:terminals.ghostty]]
- [[fact:terminals.wezterm]]
- [[fact:terminals.iterm2]]
