[[section]]
heading = "When to stay with Warp"
body = "Stay with Warp if you want one vendor for both your terminal and your cloud agents, need Azure DevOps or Jira triggers, or want to run agent workers on your own infrastructure. [[fact:warp.surfaces]]"

[[faq]]
q = "What is the best free alternative to Warp terminal?"
a = "Ghostty, WezTerm and Alacritty are free, open-source terminals, and iTerm2 is free on macOS. Warp's own client is also open source now."

[[faq]]
q = "What is the best alternative to Warp's cloud agents?"
a = "For teams that want to use their own Claude or ChatGPT subscription, Jiro. For a similar multi-harness orchestration platform, Tembo."

[[faq]]
q = "Can Warp cloud agents use my own API key?"
a = "Not personal keys. [[fact:warp.models]]"

[[faq]]
q = "Is Jiro a terminal?"
a = "No. Jiro is a background coding agent by Nori. It works in cloud VMs, takes requests in Slack and the web, and returns pull requests."
