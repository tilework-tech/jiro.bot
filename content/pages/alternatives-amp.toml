[[section]]
heading = "When Amp is the better fit"
body = "Stay with Amp if you work trunk-based, want to choose machine sizes per thread, or want a fully free setup on your own compute and keys."

[[faq]]
q = "What is the best alternative to Amp?"
a = "For teams that review every change, Jiro: it opens pull requests and runs Claude Code or Codex in cloud VMs on your own Claude or ChatGPT subscription. For solo Claude users, Claude Code on the web."

[[faq]]
q = "Is Amp still ad-supported?"
a = "No. [[fact:amp.ads]] The free path is now its Hobby tier with your own keys or compute."

[[faq]]
q = "Does Amp have a VS Code extension?"
a = "Not anymore. [[fact:amp.extensions]]"

[[faq]]
q = "Is Jiro related to Amp or Sourcegraph?"
