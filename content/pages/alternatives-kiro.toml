[[section]]
heading = "When Kiro is the right choice"
body = "Choose Kiro if you want spec-driven development in a polished IDE, or a free tier to start with. Kiro also leaves merging to you, which is the right default. [[fact:kiro.prs]]"

[[faq]]
q = "Is Jiro the same as Kiro?"
a = "No. Jiro is a background coding agent by Nori, an independent company. Kiro is Amazon's AI coding agent and IDE. The names are one letter apart; the products and companies are unrelated."

[[faq]]
q = "What is the best free Kiro alternative?"
a = "Google Jules and OpenHands have free tiers. [[fact:jules.limits]] [[fact:openhands.pricing]] Jiro has a 30-day free trial with no card."

[[faq]]
q = "Can I use my own Claude subscription instead of Kiro credits?"
a = "Kiro sells model access through its own credits. [[fact:kiro.models]] With Jiro, Claude Code runs on your own Claude subscription or API key."
