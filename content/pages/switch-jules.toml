slug = "switch/jules-to-jiro"
family = "switch"
title = "Switching from Jules to Jiro (2026): Quickstart, Gotchas and First Week"
description = "A step-by-step quickstart for moving from Google's Jules to Jiro: GitHub, Slack, your Claude or ChatGPT login, setup script, scheduled tasks and gotchas."
question = "How do I switch from Jules to Jiro?"
answer = "Switching from Jules to Jiro takes six steps: start the free trial, install Nori's GitHub App, connect Slack, connect a Claude plan through claude setup-token (or Codex sign-in, an API key, or a Cursor key), write an org setup script, and send a first task. Jiro is a background coding agent by Nori. Repository instruction files stay where they are, Jules Scheduled Tasks become Jiro cron triggers, and the main things you leave behind are Gemini models and the jules issue label."

[[section]]
heading = "Before you start"
body = """
Have three things ready.

- Admin rights on the GitHub org.
- Permission to add an app to Slack.
- A Claude or ChatGPT plan, or an API key. Jiro doesn't run Gemini, so your Google AI subscription won't carry over [[cite:jules.models]].

Budget about an hour for setup. Then a week of small tasks.
"""

[[section]]
heading = "Quickstart"
body = """
1. **Start the trial.** Thirty days free, no card required [[cite:jiro.pricing]].
2. **Install the GitHub App.** Choose all repos or just the pilot ones [[cite:jiro.github]].
3. **Connect Slack.** Requests will mostly come from there [[cite:jiro.surfaces]].
4. **Mint a Claude token.** Laptop, terminal, `claude setup-token`. Copy what it prints. That string is valid twelve months and draws on your paid Claude seat, be it Pro, Max, Team or Enterprise [[cite:anthropic.setup-token]].
5. **Connect it in Jiro.** Paste the token. ChatGPT shop? Use the Codex login flow, or an OpenAI key. Cursor shop? Bring a Cursor key [[cite:jiro.credentials]].
6. **Script the environment.** Put install commands, language versions and service setup here so every environment boots ready [[cite:jiro.setup-script]].
7. **Send a first task.** Mention @jirobot in a channel with something tiny. Review the PR [[cite:jiro.outputs]].
8. **Optional: install Jiro's skills.** Run `npx nori-skillsets install public/jiro` for its engineering conventions.
"""

[[section]]
heading = "Port what you had"
body = """
Mostly copy-paste.

- **Instruction files.** Leave AGENTS.md or CLAUDE.md in the repo. For rules that should apply across repos, write a Nori skillset once and let Nori emit each harness's native file, whether that's CLAUDE.md or AGENTS.md [[cite:jiro.translation]].
- **Environment setup.** Jules gave you a stock VM with common toolchains and Docker [[cite:jules.where]]. If you added commands on top, move them into the setup script from step 6.
- **Scheduled Tasks.** Recreate each one as a Jiro cron trigger [[cite:jules.scheduled]] [[cite:jiro.triggers]].
- **API or CLI automations.** Rewire anything that called Jules to send a webhook to Jiro instead [[cite:jiro.triggers]].
- **Google tools.** Connect Drive, Sheets or Gmail if tasks need them [[cite:jiro.integrations]].
"""

[[section]]
heading = "Gotchas"
body = """
- **No Gemini.** Jiro runs Claude Code, Codex or Cursor [[cite:jiro.harnesses]]. Prompts tuned for Gemini may need a nudge.
- **No issue label.** Jules picks up GitHub issues labelled jules [[cite:jules.surfaces]]. Jiro doesn't watch labels. Paste the issue link into Slack instead, or wire a webhook.
- **PRs arrive, not drafts you publish.** In Jules you chose between Publish branch and Publish PR [[cite:jules.prs]]. Jiro returns its work as a pull request, commit or comment for review [[cite:jiro.outputs]], so set up branch protection if you haven't.
- **Model limits move.** Daily task caps go away [[cite:jules.limits]], but your Claude or ChatGPT plan's own usage limits now apply.
- **Token expiry.** That setup token lasts a year. Put a reminder in the calendar.
- **Check the script first.** If an early task fails strangely, a missing install step in the setup script is the usual suspect.
- **Concurrency is different.** Jules counted concurrent tasks per tier: 3, 15 or 60 [[cite:jules.limits]]. Jiro counts runtimes instead, and they sleep when idle [[cite:jiro.runtimes]].
- **One conversation, one machine.** Each active session gets its own [[cite:jiro.one-session-per-machine]]. Parallel threads mean parallel runtimes, and Developer includes three.
"""

[[section]]
heading = "First week"
body = """
1. Day one: fix stale docs in the main README.
2. Day two: add missing tests for one module.
3. Day three: ask Jiro where the codebase has accumulated slop, and read the list before approving any cleanup.
4. Day four: hand over a small ticket from the backlog.
5. Day five: route one boring on-call fix to it.

Write each request the way you'd write a ticket for a new teammate: the goal, the file or module, how you'll judge it done. Expect questions back. Jiro is supposed to push on vague asks.

Keep tasks reviewable in a few minutes. Grow scope only after the PRs look like ones your team would have written.
"""

[[section]]
heading = "What you lose"
body = """
- Gemini.
- The free tier, which gave fifteen tasks a day at no cost [[cite:jules.limits]].
- Starting work straight from a GitHub label.
- Cheap single-person pricing bundled into a Google AI plan [[cite:jules.pricing]].

What you get in return is a team agent rather than a personal one: shared Slack threads [[cite:jiro.slack-threads]], shared org context, and several harnesses behind one name.
"""

[[section]]
heading = "Cost check"
body = """
- Jules: $0 on the free tier, $19.99/month via AI Pro, $99.99+/month via AI Ultra [[cite:jules.pricing]].
- Jiro Developer: $99 a month, one user, three persistent runtimes.
- Jiro Team: $250 a month, several users, five shared runtimes [[cite:jiro.pricing]].
- Plus a model plan for every engineer: with Jiro, each person still needs their own Claude or ChatGPT plan, or an API key [[cite:jiro.credentials]]. Claude Max sits at $100 or $200 monthly, depending on the multiplier [[cite:anthropic.max]].

Per person, Jules is cheaper. Per team, compare against what you'd spend putting every engineer on a paid Google AI plan instead of sharing one Jiro workspace, and remember Nori charges no markup on the model side [[cite:jiro.no-markup]].
"""

[[section]]
heading = "Run both for two weeks"
body = """
Nothing stops you. Keep Jules for personal experiments. Route team chores to Jiro. Compare merged PRs and review time at the end.

Still deciding? Read the [Jules alternatives roundup](https://jiro.bot/alternatives/jules).
"""

[[faq]]
q = "Can Jiro use my Google AI Pro subscription?"
a = "No. Jiro runs on Claude or ChatGPT plans, API keys, or a Cursor key, not Gemini."

[[faq]]
q = "Do my Jules Scheduled Tasks transfer automatically?"
a = "No. Recreate each one as a cron trigger in Jiro. It's a few minutes per task."

[[faq]]
q = "Does Jiro work if our company uses Google Workspace?"
a = "Yes. Jiro's plans aren't tied to a Google account at all, and Drive, Sheets and Gmail are available as integrations."

[[faq]]
q = "How fast can we be up and running?"
a = "About an hour to a first pull request, if your setup script is simple."
