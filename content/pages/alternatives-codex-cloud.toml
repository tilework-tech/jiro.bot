[[section]]
heading = "When Codex cloud is enough"
body = "Stay with Codex cloud if everyone on the team has a ChatGPT plan, OpenAI models cover your work, and you start tasks from ChatGPT or the CLI."

[[faq]]
q = "What is the best alternative to OpenAI Codex cloud?"
a = "Jiro, if you want Codex plus Claude Code and Cursor in one place on your own subscriptions. Claude Code on the web if you want Anthropic's equivalent."

[[faq]]
q = "Can I use my ChatGPT subscription with Jiro?"
a = "Yes. Jiro's setup accepts a ChatGPT subscription through device-code sign-in, or an OpenAI API key, and runs Codex with it."

[[faq]]
q = "Does Codex cloud work with an API key?"
a = "Only partly. [[fact:codex.models]]"

[[faq]]
q = "Is Jiro built on Codex?"
a = "No. Jiro is a background coding agent by Nori that can run Codex, Claude Code or Cursor as the underlying agent."
