[[section]]
heading = "The day one laptop stopped being enough"
body = """
Here is how it usually goes. You are a solo developer with a Max plan and a habit. You kick off a task on claude.ai/code before lunch, close the lid, and it keeps going on Anthropic's machines while you eat [[cite:claude-code.where]]. Later you check it from your phone, and in the evening you pull the session down to your terminal with `--teleport` [[cite:claude-code.surfaces]]. No extra charge for the cloud machine, either; it comes with Pro or Max [[cite:claude-code.pricing]]. Honestly? Great tool.

Then you hire two people. Then four more.

Now the questions change. Who else can start a task? Where do they ask? Whose subscription pays? And what happens when a teammate wants to try Codex on something Claude keeps fumbling?

Claude Code on the web was built around one person and one Anthropic account, and it runs Claude models only [[cite:claude-code.models]]. The team story points to Slack, which on Team and Enterprise now means Claude Tag, still in public beta, with the old Claude Code Slack bot switched off on October 5 [[cite:claude-code.slack]]. Tag bills channel work by usage under a spend cap an admin sets [[cite:claude-code.tag-billing]].

That shift is what sends people looking. What most of them want, in the words of one Nori customer, is "Claude Code, but you don't need your laptop open" for the whole team.
"""

[[section]]
heading = "Seven alternatives, ranked for a growing team"
body = "My ranking assumes a small team, a GitHub org, a Slack workspace, and at least one Claude or ChatGPT subscription already on the expense report."

[[section]]
level = 3
heading = "1. Jiro: Claude Code for the team, not just the laptop"
body = """
Jiro is the closest thing to "my cloud Claude Code, but everyone gets one." It runs Claude Code, and also Codex or Cursor when that suits a task better [[cite:jiro.harnesses]]. You sign in with your Claude login, a ChatGPT login, or an API key [[cite:jiro.credentials]].

Work arrives from Slack, the web, Discord, a terminal, cron schedules and webhooks [[cite:jiro.surfaces]], and every conversation spins up its own cloud machine with the repos and tools in place [[cite:jiro.environment]]. Built for small teams. If you are one person who never leaves the Claude app, stick with what you have.
"""

[[section]]
level = 3
heading = "2. Claude Tag: Anthropic's own answer for teams"
body = """
If your company is on Claude Team or Enterprise, Tag is the official path. Under the hood, each thread is a throwaway sandbox powered by what is essentially your current cloud Claude Code [[cite:claude-tag.where]], and anyone in the channel can tag it in. Pro and Max users can't get it [[cite:claude-tag.plans]]. It's still a beta, too [[cite:claude-tag.beta]].
"""

[[section]]
level = 3
heading = "3. OpenAI Codex cloud: the mirror image"
body = """
Same idea from the other lab. Each task gets an OpenAI-hosted machine that keeps going while your laptop sleeps [[cite:codex.where]], included from ChatGPT Plus at $20 [[cite:codex.pricing]]. Note that the cloud side wants a ChatGPT plan; an API key alone won't open it [[cite:codex.models]].
"""

[[section]]
level = 3
heading = "4. Warp: Claude Code in someone else's cloud"
body = """
Warp surprised me. A cloud run can use Claude Code, Codex or Warp's own agent [[cite:warp.models]], kicked off from Slack, Linear, schedules and more [[cite:warp.surfaces]]. The catch for subscription holders: personal API keys don't work for cloud runs [[cite:warp.models]], and runs bill for agent time, inference and compute [[cite:warp.billing]].
"""

[[section]]
level = 3
heading = "5. Amp: bring the Max plan along"
body = """
Amp started accepting Claude Pro and Max plans on October 10 via the Agent SDK [[cite:amp.claude-plan]]. Its orbs give each thread a remote machine that outlives your closed laptop [[cite:amp.where]], and the smallest orb costs about eight cents for a full hour, metered per minute [[cite:amp.orbs]]. Watch the default Ship behavior, which commits to trunk rather than opening a PR [[cite:amp.ship]].
"""

[[section]]
level = 3
heading = "6. Cursor cloud agents: for editor loyalists"
body = """
The pull requests are polished, with screenshots, videos and logs [[cite:cursor.prs]]. Pricing is harder to forecast: cloud agents bill at API rates for whatever model you choose [[cite:cursor.models]], on top of a Premium plan or higher [[cite:cursor.pricing]].
"""

[[section]]
level = 3
heading = "7. Jules: if your team leans Google"
body = """
Jules runs Gemini [[cite:jules.models]] in short-lived Google machines with Docker preinstalled [[cite:jules.where]]. The free tier gives 15 tasks a day [[cite:jules.limits]]. Paid tiers are sold to personal Google accounts; Workspace customers are sent to an interest form [[cite:jules.accounts]], which is awkward for a company rollout.
"""

[[section]]
heading = "How I would choose, knowing what I know now"
body = """
Start with the subscription you already pay for. That alone eliminates half the table.

Then ask where your team actually talks. If it is Slack, cross off anything without a Slack front door. If half of your requests should start from a cron job or an alert, look hard at webhook and schedule support.

Last, decide how attached you are to a single lab. Plenty of people are very attached to Claude, and fair enough. But the day Claude keeps circling one stubborn migration, being able to throw Codex at it matters more than you would expect.
"""

[[section]]
heading = "Why Jiro comes first"
body = """
Because it solves the exact problem that made you search. Your team gets cloud Claude Code from Slack, on subscriptions you control, with Nori charging nothing on tokens [[cite:jiro.no-markup]].

The price is boring in a good way. Thirty free days, card not required. After that, one person pays $99 monthly on Developer, or a whole team pays $250 monthly and shares five runtimes [[cite:jiro.pricing]]. Runtimes sleep while idle [[cite:jiro.runtimes]].

The team-shaped parts are what you don't get from a solo tool. Shared org context travels with every session through skillsets [[cite:jiro.skillsets]]. An org setup script means nobody re-explains how to build the monorepo [[cite:jiro.setup-script]]. And Jiro is opinionated about craft: it tries to write what a careful senior teammate would, and it will say so when your plan looks wrong.

Real teams use it. Miravoice routes more than a quarter of its merged PRs through Nori [[cite:jiro.miravoice]], and that team configured its agent from phones, start to finish [[cite:jiro.phone]].
"""

[[section]]
heading = "When Claude Code on the web is still the right call"
body = """
If you are still a team of one, stay. Seriously. The handoff between web, phone, desktop and terminal is smooth, the cloud machine is included in your plan, and auto-fix will chase CI failures and review comments after you open the PR [[cite:claude-code.prs]]. Jiro earns its keep when other people need to start the work.
"""

[[section]]
heading = "Bringing your Claude Code habits over"
body = "Your CLAUDE.md and your Claude login both come along. The [switching guide](https://jiro.bot/switch/claude-code-web-to-jiro) walks through it like a note to a teammate."

[[faq]]
q = "What are the best Claude Code on the web alternatives?"
a = "For a small team on Claude or ChatGPT, Jiro. Then Claude Tag if you are on Claude Team or Enterprise, Codex cloud for ChatGPT shops, Warp, Amp, Cursor cloud agents and Jules."

[[faq]]
q = "Who competes with Claude Code on the web?"
a = "Google's Jules, Warp, Amp, Jiro, and both OpenAI's and Cursor's cloud agents put a coding agent on a remote machine. Claude Tag is Anthropic's own team product on that same engine [[cite:claude-tag.where]]."

[[faq]]
q = "How much does Claude Code on the web cost?"
a = "No separate price. Pro ($20 a month), Max (starting at $100) and every Team or Enterprise seat include it, with the cloud machine thrown in, and the Free plan does not include Claude Code [[cite:claude-code.pricing]]."

[[faq]]
q = "How do I get Claude Code in Slack without keeping my laptop open?"
a = "On Claude Team or Enterprise, Claude Tag does it [[cite:claude-tag.plans]]. On a Pro, Max, Team or Enterprise plan, Jiro runs Claude Code in its own cloud machine and takes requests from Slack [[cite:jiro.surfaces]]."

[[faq]]
q = "What happened to the Claude Code Slack app?"
a = "The legacy bot was retired on October 5, 2026 and stopped answering in workspaces tied to a Claude organization [[cite:claude-tag.legacy]]."

[[faq]]
q = "Can I use my Claude Max plan with Jiro?"
a = "Yes. In your own terminal, `claude setup-token` mints a long-lived token for the Max plan [[cite:anthropic.setup-token]]; paste it into Jiro's Claude connection and you are done."
