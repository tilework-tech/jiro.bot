[[section]]
heading = "When to stay with Claude Code on the web"
body = "Stay with it if you work alone, want to move one session between web, phone, desktop and terminal, and only need Claude models. Anthropic does not charge extra for the cloud VM."

[[faq]]
q = "Can I run Claude Code in the cloud with my Claude Max subscription?"
a = "Yes, with Claude Code on the web. Jiro also runs Claude Code in its cloud VMs on your own Claude subscription or API key."

[[faq]]
q = "How do I run Claude Code in Slack for my team?"
a = "Connect Jiro to Slack, GitHub and a Claude subscription or Anthropic API key, then mention Jiro in a channel. It works in a cloud VM and replies in the thread with a pull request when code changes."

[[faq]]
q = "Is Jiro made by Anthropic?"
a = "No. Jiro is a background coding agent by Nori. It runs Anthropic's Claude Code, as well as Codex and Cursor."

