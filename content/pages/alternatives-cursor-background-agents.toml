[[section]]
heading = "Why people who love Cursor still shop around"
body = """
I'll say it up front: Cursor is a great editor, and its background agents were the first time handing off a task felt like closing a tab rather than babysitting a terminal. They're called Cloud Agents now [[cite:cursor.rename]], and they've grown up. Each one gets a full development environment on Cursor's cloud, or on a self-hosted worker if you'd rather keep the machine in-house while Cursor drives the loop [[cite:cursor.where]]. When they finish, you get a merge-ready PR with screenshots, video and logs attached, one per repository touched [[cite:cursor.prs]]. That's a genuinely great hand-off.

So why look?

Money, mostly. Cursor is now sold through The X Subscription, cloud agents start at the Premium tier of $30 a month, and third-party models come out of prepaid credit at API list price [[cite:cursor.pricing]]. Cloud agent usage is charged at API rates for whatever model you pick, and your own API keys only cover chat models [[cite:cursor.models]], which means the Claude Max plan already sitting on your card doesn't help here at all. If you're on a legacy Pro or Teams plan you can stay put, but moving to the new plans is a one-way door [[cite:cursor.legacy]].

The second reason is shape. Cursor's agent is built to go away and come back finished. Some teams want a colleague who stops halfway, says "this ticket contradicts the migration you merged last week," and waits for an answer.

That's a different product.
"""

[[section]]
heading = "Six alternatives, in the order I'd try them"
body = """
I ranked these for small teams who already pay a model vendor and want the agent to live where the team talks. Solo hackers might shuffle the middle.
"""

[[section]]
level = 3
heading = "1. Jiro — the one that argues back"
body = """
Jiro is the collaborative option, and that's the whole pitch. You mention it in a Slack thread, the thread fills up with the people who care, and Jiro works in the open [[cite:jiro.slack-threads]], questioning a plan that looks wrong and flagging a misstep before it becomes a pull request. It's built to aim for the change you'd have written yourself on a good day, which is a refreshingly modest goal.

Under the hood, each chat is handed a whole cloud computer, repos cloned and tools installed [[cite:jiro.environment]]. You pick the harness per task: Claude Code, Codex or Cursor [[cite:jiro.harnesses]]. Claude Code and Codex use the Claude or ChatGPT login or API key you already have, while the Cursor harness wants a Cursor API key [[cite:jiro.credentials]], so you don't have to give up Cursor's agent to leave Cursor's billing. Nori takes no cut of tokens [[cite:jiro.no-markup]].

You can poke it from Slack, a browser tab, Discord or your terminal [[cite:jiro.surfaces]]. It can also start at 3 a.m. on a cron schedule, or the moment a webhook fires [[cite:jiro.triggers]]. You wake up to a pull request.
"""

[[section]]
level = 3
heading = "2. Claude Code on the web — the closest cousin"
body = """
If what you loved about Cursor was really Claude underneath, this is the shortest hop. Sessions run on Anthropic's own machines, 4 vCPU and 16 GB by default, and carry on happily once your lid is closed [[cite:claude-code.where]]. It's included with Pro, Max, Team and Enterprise at no extra cost for the environment [[cite:claude-code.pricing]].

And `claude --teleport` pulls a cloud session back to your own machine [[cite:claude-code.surfaces]], which is a magic trick every editor person will appreciate. Claude models only, though.
"""

[[section]]
level = 3
heading = "3. Amp — for taste-obsessed tinkerers"
body = """
Amp has the most opinionated personality in this group, and as of 10 October 2026 it accepts Claude Pro and Max plans through the Claude Agent SDK [[cite:amp.claude-plan]]. Cloud work runs in orbs, one remote machine per thread [[cite:amp.where]], and there's a free Hobby tier alongside Megawatt at $20 and Gigawatt at $200 a month [[cite:amp.pricing]].

Two caveats for Cursor people. Amp retired its VS Code and Cursor extensions in February [[cite:amp.extensions]]. And its default Ship pushes straight to your base branch after tests unless you switch on Push to Branch [[cite:amp.ship]]. Flip that setting on day one.
"""

[[section]]
level = 3
heading = "4. OpenAI Codex cloud — if ChatGPT is home"
body = """
Codex cloud gives each task an OpenAI-hosted VM that keeps working while your laptop sleeps [[cite:codex.where]], and any ChatGPT plan from the $20 Plus tier upward includes it [[cite:codex.pricing]]. Slack requests now go through @ChatGPT rather than @Codex [[cite:codex.slack]]. You review the diff and open the pull request yourself [[cite:codex.prs]]. Simple, cheap, OpenAI-only.
"""

[[section]]
level = 3
heading = "5. Tembo — the harness buffet"
body = """
Tembo lets you choose among Claude Code, Codex, Cursor, Amp and more per task, on your own keys or a Claude, ChatGPT or SuperGrok subscription [[cite:tembo.models]]. The trigger list is delightfully long, everything from a Sentry error or a PagerDuty page to plain Slack mentions and code-host events [[cite:tembo.surfaces]]. Plans run $60 or $200 monthly with a usage allowance, and the machines meter per second beyond that [[cite:tembo.pricing]].
"""

[[section]]
level = 3
heading = "6. GitHub Copilot cloud agent — if GitHub is your whole world"
body = """
Copilot's agent runs on GitHub Actions runners in sessions of up to 59 minutes [[cite:copilot.where]], and Pro starts at $10 a month [[cite:copilot.pricing]]. On the higher plans you can even assign tasks to Claude or Codex as third-party agents, still in preview [[cite:copilot.third-party]]. It's the least editor-shaped option here. That's sometimes a feature.
"""

[[section]]
heading = "How I'd actually choose"
body = """
Forget feature grids for a second and picture an ordinary Tuesday. Where does the request come from: a Slack thread, a GitHub issue, an alert at midnight? Whose invoice do the tokens land on? Do you want the agent to finish quietly, or to interrupt you when the ticket is wrong?

If the answers are "Slack, our existing Claude plan, and please interrupt me," you already know where I'm going.
"""

[[section]]
heading = "Why Jiro is my first pick"
body = """
Because the cost math stops being scary. One person gets three persistent runtimes on Developer for $99 a month, a whole group shares five on Team for $250, and the first 30 days cost nothing and need no card [[cite:jiro.pricing]]. Idle runtimes sleep [[cite:jiro.runtimes]]. Your model spend stays on the plan you already bought.

Hooking up a Claude plan is quick. On your laptop, run `claude setup-token`, sign in, and it hands you a token tied to your paid plan for a year [[cite:anthropic.setup-token]]; drop that into Jiro and you're done.

The proof I find most convincing is boring in the best way. At Miravoice, Nori now accounts for over 25% of the pull requests that get merged, and one of their engineers reckons it easily buys back five hours a week [[cite:jiro.miravoice]]. They set the whole thing up from their phones [[cite:jiro.phone]]. Jiro is happiest on the chores: cleaning up slop, filling test gaps, fixing the docs nobody reads, and making a codebase easier for the next agent to understand.
"""

[[section]]
heading = "When you should stay with Cursor"
body = """
Stay if your repos live on GitLab, Bitbucket or Azure DevOps, or if you kick off agents from Microsoft Teams, iOS or GitHub and Bitbucket comments [[cite:cursor.surfaces]]. Stay if those screenshot-and-video PRs are what sells changes to your reviewers [[cite:cursor.prs]]. And stay if you need self-hosted workers [[cite:cursor.where]].

Plenty of people should stay, to be fair. The editor is still the editor.
"""

[[section]]
heading = "Ready to move some work over?"
body = """
The [switching guide](https://jiro.bot/switch/cursor-to-jiro) walks through each Cursor workflow as a before and after, including how to carry your Cursor rules across and keep Cursor's agent running inside Jiro.
"""

[[faq]]
q = "What are the best Cursor background agents alternatives?"
a = "Start with Jiro when your five-to-twenty-person team already pays Anthropic or OpenAI. Claude Code on the web, Amp, Codex cloud, Tembo and Copilot's cloud agent are the other strong picks, depending on whether you value Claude-only simplicity, personality, ChatGPT bundling, harness choice or GitHub integration."

[[faq]]
q = "Who competes with Cursor Cloud Agents?"
a = "Anthropic, OpenAI and GitHub all ship cloud coding agents of their own, and Amp, Tembo, Devin and Jiro compete from the independent side."

[[faq]]
q = "How much do Cursor background agents cost?"
a = "You need Premium at $30 a month or above under The X Subscription, and third-party model usage draws on prepaid credit at API list price [[cite:cursor.pricing]]."

[[faq]]
q = "Are Cursor background agents and Cloud Agents the same thing?"
a = "Yes, same feature, new name [[cite:cursor.rename]]."

[[faq]]
q = "Do my own model keys work with Cursor's cloud agents?"
a = "Not for the agent itself. Cursor's custom keys only work with chat models, and cloud agents are billed at API pricing for the chosen model [[cite:cursor.models]]."

[[faq]]
q = "Can Jiro run Cursor's agent?"
a = "Yes. Pick Cursor as the harness and hand Jiro a Cursor API key [[cite:jiro.credentials]]."
