[[section]]
heading = "When to stay with Cursor"
body = """
Stay with Cursor if your developers live in the editor, want the agent in the same tool, or your repos live on GitLab, Bitbucket or Azure DevOps. [[fact:cursor.surfaces]]
"""

[[faq]]
q = "Are Cursor background agents and Cursor cloud agents the same thing?"
a = "Yes. [[fact:cursor.rename]]"

[[faq]]
q = "Can Jiro run Cursor's agent?"
a = "Yes. Cursor is one of the agents Jiro can run in its cloud VMs, alongside Claude Code and Codex. Cursor needs your Cursor API key; Claude Code and Codex use your Claude or ChatGPT credentials."

[[faq]]
q = "What is the best Cursor background agents alternative for Slack?"
a = "Jiro is built around Slack: mention it in a channel and it replies in the thread and opens pull requests. Cursor, Codex and Copilot also take requests from Slack."

[[faq]]
q = "Is Jiro a code editor?"
a = "No. Jiro is a background coding agent by Nori. It works in cloud VMs and returns pull requests; you keep your editor."
