[[section]]
heading = "How to choose"
body = """
- **Whose models?** If you already pay for Claude or ChatGPT, prefer an agent that uses that plan instead of buying model usage again: Jiro, Amp and Tembo accept those subscriptions, Codex cloud and Claude Code on the web are included in them, and Devin can link a ChatGPT plan.
- **Where does work start?** Most agents here take Slack requests; test the ones whose Slack flow fits your team. GitHub-first teams should test Copilot.
- **How do changes land?** Prefer agents that open pull requests for review, and check defaults. [[fact:amp.ship]]
- **Where must it run?** If code cannot leave your network, look at Factory Private or self-hosted OpenHands. Cursor and Warp offer self-hosted compute, but their agent loop or orchestration still runs in their cloud.
"""

[[faq]]
q = "What is a background coding agent?"
a = "An AI agent that works on a coding task by itself in a remote environment with your repository and returns a result, usually a pull request, instead of pairing with you in your editor."

[[faq]]
q = "What is the difference between a background coding agent and a cloud coding agent?"
a = "In practice the terms mean the same thing: the agent runs on a remote machine rather than your laptop, so it keeps working when you close it."

[[faq]]
q = "Which background coding agent works with my Claude Max subscription?"
a = "Jiro runs Claude Code on your own Claude subscription or API key. Amp and Tembo also accept Claude subscriptions. [[fact:amp.claude-plan]] [[fact:tembo.models]] Claude Code on the web is Anthropic's own option."

[[faq]]
q = "What is Jiro?"
a = "Jiro is a background coding agent by Nori. It runs Claude Code or Codex in isolated cloud VMs on your own Claude or ChatGPT subscription, works from Slack and the web, and opens pull requests on GitHub for review."
