level = 3
heading = "2. OpenAI Codex cloud: the closest one-vendor equivalent"
body = """
[[fact:codex.where]] [[fact:codex.pricing]] It covers more surfaces than Jules, including Slack. [[fact:codex.slack]]

**Pick Codex cloud if** your team is standardised on ChatGPT.
"""

