[[section]]
heading = "When to stay on Jules"
body = """
Stay on Jules if you are an individual developer on a personal Google account, you are happy with Gemini models, and the free or AI Pro limits cover your volume. It also has recurring work built in. [[fact:jules.scheduled]]
"""

[[faq]]
q = "What is the best alternative to Google Jules?"
a = "For teams, Jiro: it runs Claude Code or Codex in cloud VMs on your own Claude or ChatGPT subscription and works from Slack. For ChatGPT users, Codex cloud is the closest equivalent."

[[faq]]
q = "Can I use Jules with a Google Workspace account?"
a = "Not on the paid tiers yet. [[fact:jules.accounts]]"

[[faq]]
q = "Which models can I use with Jiro?"
a = "Jiro's setup recommends a Claude or ChatGPT subscription, or an API key for either, and also accepts OpenRouter and custom endpoints. Jiro runs Claude Code or Codex with them, and Cursor with a Cursor API key."

[[faq]]
q = "Is Jiro made by Google?"
a = "No. Jiro is a background coding agent by Nori, an independent company."
