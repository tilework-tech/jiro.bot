body = """
[[fact:openhands.what]] [[fact:openhands.trigger]]

**Pick OpenHands if** you like Copilot's label-an-issue flow but want to self-host.
"""

[[section]]
heading = "When to stay with Copilot"
body = "Stay with Copilot if your organisation already pays for Copilot Business or Enterprise, tasks fit in one session, and you want the agent to live entirely inside GitHub. It can also hand tasks to Claude and Codex. [[fact:copilot.third-party]]"

[[faq]]
q = "Is GitHub Copilot coding agent the same as Copilot cloud agent?"
a = "Yes. [[fact:copilot.what]]"

[[faq]]
q = "When should I pick Copilot over Jiro?"
a = "When your organisation already pays for Copilot, work starts as GitHub issues, and tasks fit in one Actions session. Pick Jiro when work starts in Slack or you want to use your own Claude or ChatGPT subscription."

[[faq]]
q = "Can I use my own model subscription instead of Copilot credits?"
a = "Yes with Jiro, which runs Claude Code or Codex on your own Claude or ChatGPT subscription, an API key or OpenRouter, or Cursor with a Cursor API key."

[[faq]]
q = "Does Jiro work with GitHub branch protection?"
a = "Yes. Jiro works through pull requests on your GitHub repos, so your branch protection and required checks apply to its changes."
