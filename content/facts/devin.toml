name = "Devin"

[[fact]]
id = "what"
text = "Cognition describes Devin as an autonomous software engineer that runs in the cloud or on your machine and tests its work in its own browser."
short = "Autonomous software engineer (Cognition)"
source = "https://devin.ai/"
checked = "2026-10-16"

[[fact]]
id = "where"
text = "Devin Cloud runs each session in its own VM; Devin CLI and Devin Desktop run locally."
short = "Cognition cloud VMs, or local"
source = "https://docs.devin.ai/llms.txt"
checked = "2026-10-16"

[[fact]]
id = "models"
text = "Devin uses models from Anthropic, OpenAI and Google plus Cognition's own SWE models, picked by an Adaptive router; Pro, Max and Teams users can link a ChatGPT plan for the GPT share of usage."
short = "Multi-vendor, Cognition-routed; ChatGPT plan linking on paid plans"
source = "https://docs.devin.ai/admin/billing/chatgpt.md"
checked = "2026-10-16"

[[fact]]
id = "surfaces"
text = "Devin works from its web app, Devin Desktop, the Devin CLI, Slack, Microsoft Teams, Linear and Jira, with GitHub, GitLab and Bitbucket repos."
short = "Web, desktop, CLI, Slack, Teams, Linear, Jira"
source = "https://docs.devin.ai/llms.txt"
checked = "2026-10-16"

[[fact]]
id = "pricing"
text = "Devin's self-serve plans are Free, Pro at $20 a month, Max at $200 a month and Teams at an $80 monthly minimum plus $40 per seat; usage beyond the quota is billed at API pricing, and Enterprise is billed in ACUs."
short = "Free; Pro $20/mo; Max $200/mo; Teams $80/mo + $40/seat; overage at API prices"
source = "https://devin.ai/pricing"
checked = "2026-10-16"

[[fact]]
id = "plans-change"
text = "Cognition replaced its ACU-based Core and Team plans with quota-based self-serve plans on 2026-04-14."
short = "Quota plans since 2026-04-14"
source = "https://cognition.com/blog/new-self-serve-plans-for-devin"
checked = "2026-10-16"

[[fact]]
id = "desktop"
text = "Windsurf became Devin Desktop on 2026-06-02."
short = "Windsurf is now Devin Desktop"
source = "https://cognition.com/blog/introducing-devin-desktop"
checked = "2026-10-16"

[[fact]]
id = "automations"
text = "Devin Automations start sessions on schedules, webhooks, and Slack, GitHub and Linear events."
short = "Schedules, webhooks, Slack/GitHub/Linear events"
source = "https://docs.devin.ai/product-guides/automations.md"
checked = "2026-10-16"

[[fact]]
id = "concurrency"
text = "Free and Pro allow up to 10 concurrent Devin sessions; Max and Teams have no concurrency cap."
short = "10 concurrent on Free/Pro"
source = "https://docs.devin.ai/admin/billing/self-serve.md"
checked = "2026-10-16"

[[fact]]
id = "prs"
text = "Devin opens pull requests, responds to review comments, splits large changes into stacked PRs and fixes merge conflicts on its own PRs."
short = "Opens and maintains PRs"
source = "https://docs.devin.ai/llms.txt"
checked = "2026-10-16"

[[fact]]
id = "enterprise"
text = "Devin Enterprise offers a dedicated single-tenant VPC deployment; the agent's planning still runs in Cognition's cloud."
short = "Dedicated VPC deployment (Enterprise)"
source = "https://docs.devin.ai/enterprise/deployment/overview.md"
checked = "2026-10-16"

[[fact]]
id = "harness"
text = "Devin Cloud runs Cognition's Devin agent; Devin Desktop can also host other agents that speak ACP."
short = "Devin's own agent; Desktop also hosts ACP agents"
source = "https://cognition.com/blog/introducing-devin-desktop"
checked = "2026-10-16"
