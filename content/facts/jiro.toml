# Jiro is Nori's background coding agent; Nori's public site and docs are the source for Jiro's own claims.
name = "Jiro"

[[fact]]
id = "pricing"
text = "Nori's plans start with a free 30-day trial with no card; Developer is $99 a month for one user with up to three persistent runtimes, and Team is $250 a month for multiple users sharing five runtimes."
